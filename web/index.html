<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI-SEQ — step sequencer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">PI-SEQ<span class="blink">▮</span></div>
  <div class="pat-box">
    <button id="p1" class="pat">P1</button>
    <button id="p2" class="pat">P2</button>
    <button id="p3" class="pat">P3</button>
    <button id="p4" class="pat">P4</button>
  </div>
  <div class="transport">
    <button id="playBtn" class="big" title="space">▶</button>
    <div class="bpm-box">
      <label>BPM</label>
      <input id="bpmInput" type="number" min="40" max="300" value="120">
    </div>
    <div class="bar-box">
      <button id="barPrev" title="prev bar (←)">◀</button>
      <span id="barLabel">bar 1/2</span>
      <button id="barNext" title="next bar (→)">▶</button>
      <input id="lenInput" type="number" min="1" max="32" value="2" title="pattern length (bars)">
      <span class="dim" id="posLabel">--</span>
    </div>
  </div>
  <div class="fx">
    <label>SWING <input id="swingRange" type="range" min="0" max="100" value="0"> <span id="swingVal">0%</span></label>
    <label>JIT <input id="humanizeTime" type="range" min="0" max="30" value="0"> <span id="humanizeTimeVal">0ms</span></label>
    <label>VEL <input id="humanizeVel" type="range" min="0" max="100" value="0"> <span id="humanizeVelVal">0%</span></label>
    <button id="probModeBtn" class="prob">PROB</button>
    <input id="probSlider" type="range" min="0" max="100" value="100"> <span id="probSliderVal">100</span>
    <button id="songBtn" class="song">SONG</button>
    <input id="songLenInput" type="number" min="1" max="16" value="4" title="song length (entries)">
    <button id="recBtn" class="rec">REC</button>
    <button id="clearAutoBtn">CLR AUT</button>
    <span class="dim" id="autoCount">aut:0</span>
  </div>
</header>

<div class="midi-bar">
  <span class="dim">MIDI IN</span>
  <select id="midiPortSelect"></select>
  <button id="midiOpenBtn">OPEN</button>
  <span class="dim" id="midiInLabel">—</span>
  <span class="dim">→</span>
  <select id="midiActionSelect" title="action to assign"></select>
  <button id="midiLearnBtn" title="turn a knob / press a button on the controller">LEARN</button>
  <button id="midiMapClearBtn" title="clear all mappings">CLR MAP</button>
  <span id="midiMapList" class="midi-maps"></span>
</div>

<main id="grid"></main>

<footer>
  <span class="dim">click = on/off · PROBモードONでクリック→発音確率設定 · SWINGは裏拍の遅延 · SONG行クリックで各エントリのパターン選択 · REC onのまま再生中に触ったツマミがオートメーション録音</span>
  <span class="dim midi" id="midiLabel">midi: ...</span>
</footer>

<script src="app.js"></script>
</body>
</html>
